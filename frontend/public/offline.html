<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1f3a" />
  <title>Fiyox — Offline</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f6f7f4; color: #0b1f3a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%; text-align: center;
      background: #ffffff; border: 1px solid #e6e8e1; border-radius: 16px;
      padding: 32px 24px;
    }
    img { height: 40px; width: auto; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #46504a; margin: 0 0 20px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: #0b1f3a; color: #fff; font-size: 15px; font-weight: 600;
      border-radius: 10px; padding: 12px 22px;
    }
    .hint { margin-top: 16px; font-size: 12.5px; color: #8a938c; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="Fiyox" />
    <h1>You're offline</h1>
    <p>Fiyox needs a connection to load live school data. Check your network and try again — pages you've already opened will still work.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="hint">Fiyox School Management System</p>
  </div>
</body>
</html>
